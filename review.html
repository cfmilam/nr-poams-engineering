<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YIG Phase Rotation Experiment — Review</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  :root { --bg: #faf8f2; --text: #2a2a2a; --card: #f0ebe0; --accent: #8b6914; --border: #ddd; --link: #0369a1; --strong: #1a1a1a; --h3: #0369a1; --h4: #2e7d32; }
  :root[data-theme="dark"] { --bg: #1a1a2e; --text: #e0e0e0; --card: #2d2d44; --accent: #c9a84c; --border: #444; --link: #4fc3f7; --strong: #fff; --h3: #4fc3f7; --h4: #66bb6a; }
  #theme-btn { position: fixed; top: 1rem; right: 1rem; z-index: 200; background: var(--accent); color: var(--bg); border: none; width: 40px; height: 40px; border-radius: 8px; font-size: 1.3rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Georgia', serif; line-height: 1.7; margin: 0; padding: 2rem; }
  #content { max-width: 900px; margin: 0 auto; }
  h1 { color: var(--accent); font-size: 2rem; border-bottom: 2px solid var(--accent); padding-bottom: 0.5rem; }
  h2 { color: var(--accent); font-size: 1.5rem; margin-top: 2.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.3rem; }
  h3 { color: var(--h3); font-size: 1.2rem; margin-top: 2rem; }
  h4 { color: var(--h4); font-size: 1.1rem; margin-top: 1.5rem; }
  p { margin: 0.8rem 0; }
  table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
  th, td { border: 1px solid var(--border); padding: 0.5rem 0.8rem; text-align: left; }
  th { background: var(--card); color: var(--accent); }
  tr:nth-child(even) { background: rgba(45,45,68,0.5); }
  code { background: var(--card); padding: 0.15rem 0.4rem; border-radius: 3px; font-size: 0.9em; }
  pre { background: var(--card); padding: 1rem; border-radius: 6px; overflow-x: auto; border: 1px solid var(--border); }
  pre code { background: none; padding: 0; }
  blockquote { border-left: 3px solid var(--accent); margin: 1rem 0; padding: 0.5rem 1rem; background: rgba(201,168,76,0.1); }
  strong { color: var(--strong); }
  a { color: var(--link); }
  ul, ol { padding-left: 1.5rem; }
  li { margin: 0.3rem 0; }
  hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
</style>
</head>
<body>
<button id="theme-btn" onclick="poamsToggleTheme()" title="Toggle theme (T)" aria-label="Toggle light/dark theme">🌙</button>
<div id="content">Loading...</div>
<script>
fetch('yig-phase-rotation-experiment-paper.md')
  .then(r => r.text())
  .then(md => {
    document.getElementById('content').innerHTML = marked.parse(md);
    if (window.MathJax) MathJax.typeset();
  });
function poamsToggleTheme(){var h=document.documentElement,dark=h.getAttribute('data-theme')==='dark';if(dark){h.removeAttribute('data-theme')}else{h.setAttribute('data-theme','dark')}var b=document.getElementById('theme-btn');if(b)b.textContent=dark?'🌙':'☀️';}
document.addEventListener('keydown',e=>{if(e.key==='t'||e.key==='T'){poamsToggleTheme();}});
</script>
</body>
</html>
